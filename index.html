<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador Igrot Kodesh</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; color: #1a252f; }
    .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
    input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 12px 24px; font-size: 16px; background: #0066cc; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #0052a3; }
    .results-list { display: grid; gap: 12px; }
    .letter-card { background: white; padding: 15px 20px; border-radius: 8px; border: 1px solid #e1e4e8; cursor: pointer; transition: all 0.2s; }
    .letter-card:hover { border-color: #0066cc; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .letter-title { font-weight: bold; color: #0066cc; font-size: 18px; }
    .letter-date { font-size: 14px; color: #666; margin-top: 4px; }
    .letter-summary { margin-top: 8px; font-size: 15px; color: #444; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
    .modal { background: white; padding: 25px; border-radius: 8px; max-width: 700px; width: 100%; max-height: 85vh; overflow-y: auto; position: relative; }
    .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; border: none; background: none; cursor: pointer; }
    .loading { text-align: center; font-style: italic; color: #666; margin: 20px 0; }
    .hebrew-text { font-family: 'SBL Hebrew', 'Times New Roman', serif; direction: rtl; text-align: right; background: #fdfbf7; padding: 12px; border-right: 3px solid #0066cc; margin: 15px 0; font-size: 17px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Buscador Igrot Kodesh</h1>
    <div class="search-box">
      <input type="text" id="queryInput" placeholder="Escribe un tema (ej. parnasa, salud, educación, matrimonio)...">
      <button onclick="searchLetters()">Buscar</button>
    </div>

    <div id="status" class="loading" style="display:none;">Buscando cartas relacionadas...</div>
    <div id="resultsList" class="results-list"></div>
  </div>

  <!-- Modal para ver el detalle de la carta -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    async function searchLetters() {
      const query = document.getElementById('queryInput').value.trim();
      if (!query) return;

      const statusEl = document.getElementById('status');
      const listEl = document.getElementById('resultsList');

      statusEl.style.display = 'block';
      statusEl.innerText = 'Consultando Igrot Kodesh (buscando de 10 a 15 cartas)...';
      listEl.innerHTML = '';

      try {
        const res = await fetch('/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });

        const data = await res.json();
        statusEl.style.display = 'none';

        if (!Array.isArray(data) || data.length === 0) {
          listEl.innerHTML = '<p>No se encontraron cartas sobre este tema. Intenta con otro término.</p>';
          return;
        }

        data.forEach(item => {
          const card = document.createElement('div');
          card.className = 'letter-card';
          card.onclick = () => loadLetterDetail(item);
          card.innerHTML = `
            <div class="letter-title">${item.letter_id}</div>
            <div class="letter-date">📅 ${item.hebrew_date}</div>
            <div class="letter-summary">${item.summary || 'Haz clic para cargar el texto traducido.'}</div>
          `;
          listEl.appendChild(card);
        });

      } catch (err) {
        statusEl.innerText = 'Error al conectar con la API.';
      }
    }

    async function loadLetterDetail(item) {
      const modal = document.getElementById('modalOverlay');
      const modalContent = document.getElementById('modalContent');

      modal.style.display = 'flex';
      modalContent.innerHTML = `
        <h2>${item.letter_id}</h2>
        <p><strong>Fecha:</strong> ${item.hebrew_date}</p>
        <div class="loading">Traduciendo y cargando contenido completo del Rebbe...</div>
      `;

      try {
        const res = await fetch('/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ selected_letter: item })
        });

        const detail = await res.json();

        modalContent.innerHTML = `
          <h2>${detail.letter_id}</h2>
          <p><strong>Fecha:</strong> ${detail.hebrew_date}</p>
          <hr>
          <h4>Texto Original (Hebreo / Yiddish):</h4>
          <div class="hebrew-text">${detail.original_text}</div>
          <h4>Traducción al Español:</h4>
          <p style="line-height: 1.6;">${detail.translated_text}</p>
        `;
      } catch (err) {
        modalContent.innerHTML += `<p style="color:red;">Error al cargar el detalle de la carta.</p>`;
      }
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
    }
  </script>
</body>
</html>
